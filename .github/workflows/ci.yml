name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build y tests
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          # Zulu 21 es el JDK que pide gradle/gradle-daemon-jvm.properties (vendor AZUL).
          distribution: zulu
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compilar, testear y analizar (lint)
        run: ./gradlew build
